name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (branch, tag, sha). Uses github.ref if empty."
        required: false
        default: ""

permissions:
  contents: write # to publish releases

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: linux
            goarch: arm
            goarm: "6"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Resolve version metadata
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          commit="$(git rev-parse --short HEAD)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}"   >> "$GITHUB_OUTPUT"
          suffix="${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ -n "${{ matrix.goarm }}" ]; then suffix="${suffix}v${{ matrix.goarm }}"; fi
          echo "suffix=${suffix}"   >> "$GITHUB_OUTPUT"

      - name: Build (CGO disabled, static)
        env:
          CGO_ENABLED: "0"
          GOOS:   ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM:  ${{ matrix.goarm }}
        run: |
          set -euo pipefail
          out="dist/bp35c2-collector-${{ steps.meta.outputs.suffix }}"
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.meta.outputs.version }} -X main.commit=${{ steps.meta.outputs.commit }}" \
            -o "${out}" \
            ./cmd/bp35c2-collector
          ls -la "${out}"
          file "${out}" || true

      - name: Package tarball
        run: |
          set -euo pipefail
          suffix="${{ steps.meta.outputs.suffix }}"
          version="${{ steps.meta.outputs.version }}"
          stage="dist/pkg/bp35c2-collector-${version}-${suffix}"
          mkdir -p "${stage}"
          cp "dist/bp35c2-collector-${suffix}" "${stage}/bp35c2-collector"
          cp README.md LICENSE 2>/dev/null "${stage}/" || true
          cp -r examples "${stage}/"
          cp -r systemd  "${stage}/"
          tar -C dist/pkg -czf "dist/bp35c2-collector-${version}-${suffix}.tar.gz" \
            "$(basename ${stage})"
          sha256sum "dist/bp35c2-collector-${version}-${suffix}.tar.gz" \
            > "dist/bp35c2-collector-${version}-${suffix}.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bp35c2-collector-${{ steps.meta.outputs.suffix }}
          path: |
            dist/bp35c2-collector-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.suffix }}.tar.gz
            dist/bp35c2-collector-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.suffix }}.tar.gz.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
